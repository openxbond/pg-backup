name: Release

# Publishes ghcr.io/openxbond/pg-backup:<pg major> on every push to main, plus
# <pg major>-<version> for v* tags. `latest` follows the newest PostgreSQL major.
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/openxbond/pg-backup
  LATEST_PG: "18"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        pg: ["16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          tags="$IMAGE:${{ matrix.pg }}"
          if [ "${{ matrix.pg }}" = "$LATEST_PG" ]; then tags="$tags,$IMAGE:latest"; fi
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tags="$tags,$IMAGE:${{ matrix.pg }}-${GITHUB_REF_NAME#v}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
