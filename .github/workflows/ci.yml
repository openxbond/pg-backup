name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck backup.sh test/smoke.sh
      - name: Build
        run: docker build -t pg-backup:test .
      - name: Smoke test (backup, restore, TimescaleDB hypertable)
        run: sh test/smoke.sh pg-backup:test
